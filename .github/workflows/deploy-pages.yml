name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Calculate conventional semantic version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          majorList: ''
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, test, tests
          skipInvalidTags: true
          tagFilter: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          maxTagsToFetch: 100
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Apply calculated manager version
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.nextStrict || steps.semver.outputs.current }}
        run: node scripts/set-manager-version.mjs "${RELEASE_VERSION#v}"

      - name: Test installation tooling
        run: npm test

      - name: Build documentation
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      # Compatibility for previously installed wrappers; never tracked in Git.
      - name: Generate legacy updater checksum
        run: sha256sum .vitepress/dist/gestalt > .vitepress/dist/gestalt.sha256

      - name: Commit and tag manager version
        if: steps.semver.outputs.bump != 'none'
        env:
          TAG: ${{ steps.semver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- public/gestalt
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG [skip ci]"
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
