name: Final current Manager verification
on:
  push:
    branches: [test/final-current-r9]
permissions:
  contents: read
jobs:
  windows-producer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          architecture: x64
          package-manager-cache: false
      - name: Run windows-producer verification
        shell: powershell
        env:
          FINAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          node tests/final-current-transport/driver.mjs windows-producer
      - uses: actions/upload-artifact@v6
        with:
          name: final-current-msvc-x64-${{ github.run_attempt }}
          path: |
            native-evidence/final-current/producer/gestalt-owned-process.exe
            native-evidence/final-current/producer/gestalt-owned-process.exe.provenance.json
            native-evidence/final-current/producer/helper-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-current-windows-producer-evidence-${{ github.run_attempt }}
          path: |
            native-evidence/final-current/windows-producer/
            !native-evidence/final-current/windows-producer/private-toolchain/**
          if-no-files-found: error
  windows-agents-storage:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          architecture: x64
          package-manager-cache: false
      - name: Verify two Agents storage operations as a standard user
        shell: powershell
        env:
          PROBE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          & ./tests/windows-agents-storage-diagnostic/standard-user.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-agents-storage-diagnostic-evidence-${{ github.run_attempt }}
          path: native-evidence/windows-agents-storage-diagnostic/
          if-no-files-found: error
  windows-consumer:
    runs-on: windows-latest
    timeout-minutes: 135
    needs: [windows-producer, windows-agents-storage]
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          architecture: x64
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: final-current-msvc-x64-${{ github.run_attempt }}
          path: native-evidence/final-current/input
      - name: Run windows-consumer verification
        shell: powershell
        env:
          FINAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          node tests/final-current-transport/driver.mjs windows-consumer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/final-current-transport/consume.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-current-windows-consumer-evidence-${{ github.run_attempt }}
          path: |
            native-evidence/final-current/windows-consumer/
            !native-evidence/final-current/windows-consumer/private-toolchain/**
          if-no-files-found: error
  unix-pair:
    needs: windows-producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: final-current-msvc-x64-${{ github.run_attempt }}
          path: native-evidence/r9-windows-input
      - name: Verify direct and packaged Unix setup using the pinned Agents checkout
        shell: bash
        env:
          R9_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          R9_RUNNER_LABEL: ${{ matrix.runner }}
          R9_RUNNER_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p native-evidence/unix-agents-pair
          node tests/unix-pair-transport/driver.mjs .native-dependencies/agents native-evidence/unix-agents-pair native-evidence/r9-windows-input \
            > native-evidence/unix-agents-pair/driver.stdout 2> native-evidence/unix-agents-pair/driver.stderr
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-current-unix-pair-${{ matrix.target }}-${{ github.run_attempt }}
          path: native-evidence/unix-agents-pair/
          if-no-files-found: error
