name: Live trusted host policy proof (no deployment)
on:
  push:
    branches: ['test/live-host-policy-l9']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Read-only accepted authentic installed-source input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dyne/gestalt-agents
          ref: 129d33bc6d6c58d280d9bcf5155fab6ed9b6e0bd
          path: .host-agents-input
          persist-credentials: false
      - name: Provision the pinned original interpreter on the disposable host
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -Eeuo pipefail
          proof_node=$(node -p 'process.execPath')
          proof_npm=$(readlink -f -- "$(command -v npm)")
          proof_npx=$(readlink -f -- "$(command -v npx)")
          test "$("$proof_node" -p 'process.versions.node')" = 24.21.0
          # The supported original PATH is fixed. Provision the same setup-node
          # bytes there before birth; no policy/environment bypass or production
          # installation. This job is restricted to a disposable hosted VM.
          sudo install -m0755 "$proof_node" /usr/bin/node
          cmp -- "$proof_node" /usr/bin/node
          sudo ln -sfn -- "$proof_npm" /usr/bin/npm
          sudo ln -sfn -- "$proof_npx" /usr/bin/npx
          /usr/bin/node --version
          PATH=/usr/bin:/bin npm --version
      - name: Bind the exact checked-out source and test interpreter
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/live-host-policy
          cat > "$RUNNER_TEMP/live-host-native-inventory.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,readlinkSync,lstatSync,realpathSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const phase=process.argv[2];assert.ok(['before','after'].includes(phase));
          const git=(...args)=>execFileSync('/usr/bin/git',args,{encoding:'utf8'});
          const hash=(algorithm,value)=>createHash(algorithm).update(value).digest('hex');
          assert.equal(process.versions.node,'24.21.0');assert.equal(realpathSync(process.execPath),'/usr/bin/node');
          git('diff','--quiet');git('diff','--cached','--quiet');
          const commit=git('rev-parse','HEAD').trim(),tree=git('rev-parse','HEAD^{tree}').trim();
          assert.equal(commit,process.env.GITHUB_SHA);
          const files=git('ls-tree','-rz','--full-tree','HEAD').split('\0').filter(Boolean).map(entry=>{
            const at=entry.indexOf('\t'),[mode,type,gitBlob]=entry.slice(0,at).split(' '),path=entry.slice(at+1);
            assert.equal(type,'blob');assert.ok(['100644','100755','120000'].includes(mode));
            const info=lstatSync(path),bytes=mode==='120000'?Buffer.from(readlinkSync(path)):readFileSync(path);
            assert.equal(info.isSymbolicLink(),mode==='120000');
            if(mode!=='120000'){assert.equal(info.isFile(),true);assert.equal(Boolean(info.mode&0o111),mode==='100755');}
            assert.equal(hash('sha1',Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])),gitBlob);
            return {path,mode,gitBlob,sha256:hash('sha256',bytes),size:bytes.length};
          });
          const report={schemaVersion:1,kind:'live-host-policy-native-source',commit,tree,
            node:{version:process.versions.node,executable:process.execPath,sha256:hash('sha256',readFileSync(process.execPath))},files};
          const output='test-results/live-host-policy';
          if(phase==='after')assert.deepEqual(report,JSON.parse(readFileSync(`${output}/source-before.json`)));
          writeFileSync(`${output}/source-${phase}.json`,JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({phase,commit,tree,trackedFiles:files.length}));
          NODE
          /usr/bin/node "$RUNNER_TEMP/live-host-native-inventory.mjs" before
      - name: Cheap authenticated observer and physical cleanup regressions
        run: |
          set -Eeuo pipefail
          PATH=/usr/bin:/bin /usr/bin/node --test --test-reporter=tap tests/live-host-native-proof-observation.test.mjs 2>&1 | tee test-results/live-host-policy/proof-fixtures.log
      - name: Verify accepted package and supported original interpreter
        run: |
          set -Eeuo pipefail
          test "$(git -C .host-agents-input rev-parse HEAD^{tree})" = 414a89284efbb050188ca1802563b92667c50994
          test "$(git -C .host-agents-input rev-parse HEAD:plugins/context-mode)" = 640de6ca23b854b3b1125d1c034a196179ac7ff8
          /usr/bin/node -e 'const [major,minor]=process.versions.node.split(".").map(Number);if(major<22||(major===22&&minor<15))throw Error("SUPPORTED_ORIGINAL_NODE_REQUIRED");console.log(JSON.stringify({node:process.versions.node,abi:process.versions.modules,executable:process.execPath}))'
          PATH=/usr/bin:/bin npm --version
      - name: Verify exact accepted Mobile source fixture
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='tests/fixtures/live-host-mobile-input';
          const provenance=JSON.parse(readFileSync(`${root}/provenance.json`));
          if(provenance.commit!=='c558dd644e4b6ac8d3bce9e57bce762791ea25de')throw Error('Mobile fixture source changed');
          for(const [path,pin] of Object.entries(provenance.files)){
            const bytes=readFileSync(`${root}/${path}`);
            if(createHash('sha256').update(bytes).digest('hex')!==pin.sha256)throw Error('Mobile fixture hash changed');
            const blob=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if(blob!==pin.gitBlob)throw Error('Mobile fixture Git blob changed');
          }
          NODE
          cp -R tests/fixtures/live-host-mobile-input .host-mobile-input
      - name: Prepare checksum-pinned native and Caddy test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tool_root="$RUNNER_TEMP/live-policy-tools"
          mkdir -p "$tool_root"
          install -m0755 public/gestalt "$tool_root/gestalt"
          gh run download 38645681271 --repo dyne/gestalt \
            --name native-mask-candidate-results --dir "$tool_root/native-artifact"
          native_archive="$tool_root/native-artifact/native-mask-candidate.tar.gz"
          printf '%s  %s\n' 08a44f4ea2d27d48eaf98b0d67b804c0cc621fcf0bd4db71b8b6832ea282c153 "$native_archive" | sha256sum --check --status
          mkdir -p "$tool_root/native"
          tar -xzf "$native_archive" -C "$tool_root/native" bin provenance.json
          native_binary="$tool_root/native/bin/codex"
          printf '%s  %s\n' b2730ae901da317bcc5933d9b87de6dfbea3e46a46b64f806e4268fd9a095578 "$native_binary" | sha256sum --check --status
          printf '%s  %s\n' 335aa87510fc0eee1bcdbedd3d9bf4aa4d112cffed72d5f1ad7a10b6cc855066 "$tool_root/native/bin/codex-resources/bwrap" | sha256sum --check --status
          printf '%s  %s\n' 396915091a1f0387b48fd06e98d06e61d22f6ff6af33bc806891a634ee03d199 "$tool_root/native/bin/codex-linux-sandbox" | sha256sum --check --status
          node --input-type=module - "$tool_root/native/provenance.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const built=JSON.parse(readFileSync(process.argv[2]));
          const pins=JSON.parse(readFileSync('tests/fixtures/live-host-native-runtime.json'));
          for(const [key,value] of Object.entries(built))assert.deepEqual(value,pins[key],`Native build provenance ${key}`);
          assert.equal(built.runId,'38645681271');
          assert.equal(built.managerHead,'75e420c5f65b1b1acb0cd0b3615564d462e365ce');
          NODE
          host_release=https://github.com/openai/codex/releases/download/rust-v0.161.0
          host_name=codex-code-mode-host-x86_64-unknown-linux-musl
          curl --fail --silent --show-error --location "$host_release/$host_name.tar.gz" --output "$tool_root/host.tar.gz"
          curl --fail --silent --show-error --location "$host_release/$host_name.sigstore" --output "$tool_root/host.sigstore"
          printf '%s  %s\n' 30cc945f77b3eed15ee385cc2f844a33bf1d7c422ff3a97161f701bffe4f77f8 "$tool_root/host.tar.gz" | sha256sum --check --status
          printf '%s  %s\n' 5b7992b56b00440c56951c05ea9e8076a98236cefd1d6eb356c1cfafe4bc29aa "$tool_root/host.sigstore" | sha256sum --check --status
          tar -xzf "$tool_root/host.tar.gz" -C "$tool_root" "$host_name"
          printf '%s  %s\n' e87096087c02aa6ab90a5a85031659665aa0bf3ee20c07ca0b8ab701c83fcd5b "$tool_root/$host_name" | sha256sum --check --status
          node --input-type=module - "$tool_root" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {X509Certificate} from 'node:crypto';
          const root=process.argv[2],legacy=JSON.parse(readFileSync(`${root}/host.sigstore`));
          const entry=legacy.rekorBundle.Payload,body=JSON.parse(Buffer.from(entry.body,'base64'));
          const certificate=new X509Certificate(Buffer.from(legacy.cert,'base64'));
          const pins=JSON.parse(readFileSync('tests/fixtures/live-host-native-runtime.json')).codeModeHost;
          assert.equal(body.spec.data.hash.algorithm,'sha256');
          assert.equal(body.spec.data.hash.value,pins.binarySha256);
          assert.ok(certificate.raw.includes(Buffer.from(pins.sourceCommit)));
          const bundle={mediaType:'application/vnd.dev.sigstore.bundle+json;version=0.1',
            verificationMaterial:{x509CertificateChain:{certificates:[{rawBytes:certificate.raw.toString('base64')}]},
              tlogEntries:[{logIndex:String(entry.logIndex),logId:{keyId:Buffer.from(entry.logID,'hex').toString('base64')},
                kindVersion:{kind:body.kind,version:body.apiVersion},integratedTime:String(entry.integratedTime),
                inclusionPromise:{signedEntryTimestamp:legacy.rekorBundle.SignedEntryTimestamp},canonicalizedBody:entry.body}]},
            messageSignature:{messageDigest:{algorithm:'SHA2_256',digest:Buffer.from(body.spec.data.hash.value,'hex').toString('base64')},signature:legacy.base64Signature}};
          writeFileSync(`${root}/host.bundle.json`,JSON.stringify(bundle));
          NODE
          npm exec --cache "$RUNNER_TEMP/live-host-sigstore-cache" --yes --package=@sigstore/cli@0.10.3 -- \
            sigstore verify "$tool_root/host.bundle.json" --blob-file "$tool_root/$host_name" \
            --certificate-identity-uri https://github.com/openai/codex/.github/workflows/rust-release.yml@refs/tags/rust-v0.161.0 \
            --certificate-issuer https://token.actions.githubusercontent.com \
            --tuf-cache-path "$RUNNER_TEMP/live-host-sigstore-tuf" --json
          install -m0755 "$tool_root/$host_name" "$tool_root/native/bin/codex-code-mode-host"
          curl --fail --silent --show-error --location \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$tool_root/caddy.tar.gz"
          printf '%s  %s\n' \
            a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7 \
            "$tool_root/caddy.tar.gz" | sha512sum --check --status
          tar -xzf "$tool_root/caddy.tar.gz" -C "$tool_root" caddy
          npm ci --prefix .host-mobile-input --omit=dev --ignore-scripts
          ./node_modules/.bin/esbuild .host-mobile-input/src/server/platform/live-design/elected-controller.ts \
            --bundle --platform=node --format=esm --target=node24 --outfile="$tool_root/mobile-election.mjs" \
            --metafile="$tool_root/election-inputs.json"
          ./node_modules/.bin/esbuild .host-mobile-input/src/server/platform/codex/codex-process-launcher.ts \
            --bundle --platform=node --format=esm --target=node24 --outfile="$tool_root/mobile-launcher.mjs" \
            --metafile="$tool_root/mobile-inputs.json"
          node --input-type=module - "$tool_root/mobile-inputs.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected={
            '.host-mobile-input/src/server/platform/codex/json-rpc-client.ts':'e87f911cff7ea8714dcdf689d616109e98c70d9191c15cf9f52dda2e835f62f0',
            '.host-mobile-input/src/server/platform/catalog/profile-command.ts':'8c6e8906ca7107722eceba172f9ab9028bc69d14a37959b910d7e53d76be4ed3',
            '.host-mobile-input/src/server/platform/codex/codex-process-launcher.ts':'e7920168cccdaec66ade038e6251948e71e71792478752ff524f6320a4b2e261'
          };
          const inputs=Object.keys(JSON.parse(readFileSync(process.argv[2])).inputs).sort();
          if(JSON.stringify(inputs)!==JSON.stringify(Object.keys(expected).sort()))throw Error('Mobile bundle input inventory changed');
          for(const [path,sha] of Object.entries(expected))if(createHash('sha256').update(readFileSync(path)).digest('hex')!==sha)throw Error('Mobile input differs from accepted source');
          NODE
          {
            echo "LIVE_HOST_MANAGER_BINARY=$tool_root/gestalt"
            echo "LIVE_HOST_CODEX_BINARY=$native_binary"
            echo "LIVE_HOST_MOBILE_MODULE=$tool_root/mobile-launcher.mjs"
            echo "LIVE_HOST_ELECTION_MODULE=$tool_root/mobile-election.mjs"
            echo "LIVE_HOST_CADDY_BINARY=$tool_root/caddy"
          } >> "$GITHUB_ENV"
      - name: Existing native sandbox prerequisites on disposable hosted runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -Eeuo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Actual host Mobile, native helper and descendant confinement
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/live-host-policy
          LIVE_HOST_AGENTS_ROOT="$GITHUB_WORKSPACE/.host-agents-input" PATH=/usr/bin:/bin /usr/bin/node scripts/live-host-policy-native-proof.mjs 2>&1 | tee test-results/live-host-policy/proof.log
          git diff --check
      - name: Publish bounded Native proof before the full suite
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-host-policy-early-native-proof
          path: |
            test-results/live-host-policy/native-proof.json
            test-results/live-host-policy/proof.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Unchanged full Manager suite on the supported host
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/live-host-policy
          PATH=/usr/bin:/bin npm test 2>&1 | tee test-results/live-host-policy/manager.log
          git diff --check
      - name: Bounded alternating digest benchmark
        if: always()
        run: |
          set -Eeuo pipefail
          test -f test-results/live-host-policy/source-before.json
          test "$(/usr/bin/node -p 'process.versions.node')" = 24.21.0
          PATH=/usr/bin:/bin timeout 90s /usr/bin/node scripts/live-host-digest-benchmark.mjs > test-results/live-host-policy/benchmark.json
      - name: Verify final source identity and unchanged tracked scope
        if: always()
        run: |
          set -Eeuo pipefail
          /usr/bin/node "$RUNNER_TEMP/live-host-native-inventory.mjs" after
          git diff --check
      - name: Bind retained artifact bytes without environment or home inventory
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/live-host-policy
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='test-results/live-host-policy',files={},missing=[];
          for(const name of ['source-before.json','source-after.json','proof-fixtures.log','native-proof.json','proof.log','manager.log','benchmark.json']){
            if(!existsSync(`${root}/${name}`)){missing.push(name);continue;}
            const bytes=readFileSync(`${root}/${name}`);
            files[name]={bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};
          }
          const report={schemaVersion:1,kind:'live-host-policy-native-artifacts',commit:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,files,missing};
          writeFileSync(`${root}/artifact-provenance.json`,JSON.stringify(report,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-host-policy-native-results
          path: test-results/live-host-policy
          if-no-files-found: ignore
          retention-days: 30
