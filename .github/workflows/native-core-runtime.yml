name: Native core runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global --ignore-scripts @openai/codex@0.164.0
      - run: npm run typecheck:cli
      - run: node scripts/record-native-setup.mjs
      - name: Prepare disposable Ubuntu ownership namespace prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Execute actual compiled runtime and inherited owner integration
        env:
          GESTALT_NATIVE_SETUP_EVIDENCE: native-evidence/setup
          GESTALT_NATIVE_RUNTIME_EVIDENCE: native-evidence/setup
          GESTALT_NATIVE_AGENTS_SOURCE: ${{ github.workspace }}/.native-dependencies/agents
        run: |
          node -e 'require("node:fs").writeFileSync("native-evidence/setup/runner.json",JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,abi:process.versions.modules,sha:process.env.GITHUB_SHA,observedAt:new Date().toISOString()}))'
          node --test --test-reporter=tap tests/native-archive.test.mjs tests/native-diagnostics.test.mjs tests/native-app-server.test.mjs tests/native-capabilities.test.mjs tests/native-skills-owner.test.mjs tests/native-skills-transfer.test.mjs tests/native-scratch.test.mjs tests/native-hook-command.test.mjs tests/native-runtime-installed.test.mjs > native-evidence/setup/contracts.tap 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-runtime-${{ matrix.os }}
          path: native-evidence/setup/

  windows:
    runs-on: windows-latest
    # Snapshot3 spent ~21m in transactions despite five early fixture failures;
    # successful repeat/selection phases plus owned cleanup need more headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - run: node scripts/record-native-setup.mjs
      - name: Run native core runtime with an isolated standard-user token
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'gc' + [Guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + '!aA1') -AsPlainText -Force
          $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
          $work = Join-Path $env:RUNNER_TEMP $name
          try {
            $users = Get-LocalGroup -SID 'S-1-5-32-545'
            Add-LocalGroupMember -Group $users -Member $user
            New-Item -ItemType Directory -Path $work | Out-Null
            $source = Join-Path $work 'source'
            # Preserve installed dependency dist directories and native binaries.
            # An unqualified /XD dist removes those at every depth.
            & robocopy $env:GITHUB_WORKSPACE $source /E /XD .git /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt 7) { throw 'Native candidate copy failed' }
            & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)F') /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Native fixture access setup failed' }
            $credential = New-Object Management.Automation.PSCredential(($env:COMPUTERNAME + '\' + $name), $password)
            $node = (Get-Command node.exe).Source
            $gitDirectory = Split-Path -Parent (Get-Command git.exe).Source
            $script = Join-Path $source 'scripts/test-core-setup-standard-user.ps1'
            $arguments = '-NoLogo -NoProfile -NonInteractive -File "' + $script + '" -Repository "' + $source + '" -Node "' + $node + '" -GitDirectory "' + $gitDirectory + '" -Suite runtime'
            $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput (Join-Path $work 'contracts.tap') -RedirectStandardError (Join-Path $work 'runner.stderr')
            Copy-Item (Join-Path $work 'contracts.tap') native-evidence/setup/
            Copy-Item (Join-Path $work 'runner.stderr') native-evidence/setup/
            Copy-Item -Path (Join-Path $source 'native-evidence/setup/*') -Destination native-evidence/setup/ -Recurse -Force
            if ($process.ExitCode -ne 0) { throw "Native standard-user core setup exited $($process.ExitCode)" }
          } finally {
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-runtime-windows
          path: native-evidence/setup/
