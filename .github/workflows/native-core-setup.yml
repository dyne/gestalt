name: Native core setup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: ee0dd9b96add7634de4e470f93c3dee111b521b9
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global --ignore-scripts @openai/codex@0.164.0
      - run: npm run typecheck:cli
      - run: node scripts/record-native-setup.mjs
      - name: Execute actual native setup and installed Agents owner
        env:
          GESTALT_NATIVE_SETUP_EVIDENCE: native-evidence/setup
          GESTALT_NATIVE_AGENTS_SOURCE: ${{ github.workspace }}/.native-dependencies/agents
        run: |
          node -e 'require("node:fs").writeFileSync("native-evidence/setup/runner.json",JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,abi:process.versions.modules,sha:process.env.GITHUB_SHA,observedAt:new Date().toISOString()}))'
          node --test --test-reporter=tap tests/native-cli.test.mjs tests/native-setup.test.mjs tests/native-setup-transactions.test.mjs tests/native-setup-installed.test.mjs > native-evidence/setup/contracts.tap 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-setup-${{ matrix.os }}
          path: native-evidence/setup/

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: ee0dd9b96add7634de4e470f93c3dee111b521b9
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - run: node scripts/record-native-setup.mjs
      - name: Run native core setup with an isolated standard-user token
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'gc' + [Guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + '!aA1') -AsPlainText -Force
          $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
          $work = Join-Path $env:RUNNER_TEMP $name
          try {
            $users = Get-LocalGroup -SID 'S-1-5-32-545'
            Add-LocalGroupMember -Group $users -Member $user
            New-Item -ItemType Directory -Path $work | Out-Null
            $source = Join-Path $work 'source'
            & robocopy $env:GITHUB_WORKSPACE $source /E /XD .git dist /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt 7) { throw 'Native candidate copy failed' }
            & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)F') /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Native fixture access setup failed' }
            $credential = New-Object Management.Automation.PSCredential(($env:COMPUTERNAME + '\' + $name), $password)
            $node = (Get-Command node.exe).Source
            $gitDirectory = Split-Path -Parent (Get-Command git.exe).Source
            $script = Join-Path $source 'scripts/test-core-setup-standard-user.ps1'
            $arguments = '-NoLogo -NoProfile -NonInteractive -File "' + $script + '" -Repository "' + $source + '" -Node "' + $node + '" -GitDirectory "' + $gitDirectory + '"'
            $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput (Join-Path $work 'contracts.tap') -RedirectStandardError (Join-Path $work 'runner.stderr')
            Copy-Item (Join-Path $work 'contracts.tap') native-evidence/setup/
            Copy-Item (Join-Path $work 'runner.stderr') native-evidence/setup/
            Copy-Item -Path (Join-Path $source 'native-evidence/setup/*') -Destination native-evidence/setup/ -Recurse -Force
            if ($process.ExitCode -ne 0) { throw "Native standard-user core setup exited $($process.ExitCode)" }
          } finally {
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-setup-windows
          path: native-evidence/setup/
