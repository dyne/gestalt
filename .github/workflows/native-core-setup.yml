name: Native core setup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global --ignore-scripts @openai/codex@0.164.0
      - run: npm run typecheck:cli
      - run: node scripts/record-native-setup.mjs
      - name: Prepare disposable Ubuntu ownership namespace prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Execute actual native setup and installed Agents owner
        env:
          GESTALT_NATIVE_SETUP_EVIDENCE: native-evidence/setup
          GESTALT_NATIVE_AGENTS_SOURCE: ${{ github.workspace }}/.native-dependencies/agents
        run: |
          node -e 'require("node:fs").writeFileSync("native-evidence/setup/runner.json",JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,abi:process.versions.modules,sha:process.env.GITHUB_SHA,observedAt:new Date().toISOString()}))'
          node --test --test-reporter=tap tests/native-cli.test.mjs tests/native-setup.test.mjs tests/native-setup-transactions.test.mjs tests/native-setup-installed.test.mjs > native-evidence/setup/contracts.tap 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-setup-${{ matrix.os }}
          path: native-evidence/setup/

  windows:
    runs-on: windows-latest
    # Leave time outside the harness deadline for preparation and evidence upload.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - run: node scripts/record-native-setup.mjs
      - name: Run native core setup with an isolated standard-user token
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'gc' + [Guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + '!aA1') -AsPlainText -Force
          $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
          $work = Join-Path $env:RUNNER_TEMP $name
          $source = Join-Path $work 'source'
          $timedOut = $false
          try {
            $users = Get-LocalGroup -SID 'S-1-5-32-545'
            Add-LocalGroupMember -Group $users -Member $user
            New-Item -ItemType Directory -Path $work | Out-Null
            # Preserve installed dependency dist directories and native binaries.
            # An unqualified /XD dist removes those at every depth.
            & robocopy $env:GITHUB_WORKSPACE $source /E /XD .git /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt 7) { throw 'Native candidate copy failed' }
            & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)F') /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Native fixture access setup failed' }
            $credential = New-Object Management.Automation.PSCredential(($env:COMPUTERNAME + '\' + $name), $password)
            $node = (Get-Command node.exe).Source
            $gitDirectory = Split-Path -Parent (Get-Command git.exe).Source
            $script = Join-Path $source 'scripts/test-core-setup-standard-user.ps1'
            $arguments = '-NoLogo -NoProfile -NonInteractive -File "' + $script + '" -Repository "' + $source + '" -Node "' + $node + '" -GitDirectory "' + $gitDirectory + '"'
            $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $credential -LoadUserProfile -ArgumentList $arguments -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $work 'contracts.tap') -RedirectStandardError (Join-Path $work 'runner.stderr')
            $handle = $process.Handle
            if ($handle -eq [IntPtr]::Zero -or $handle -eq [IntPtr](-1)) { throw 'Standard-user setup harness handle unavailable' }
            # Observe the harness exit only. The tests establish product process ownership.
            if (-not $process.WaitForExit(3300000)) {
              $timedOut = $true
              try { $process.Kill() } catch { Write-Warning $_.Exception.Message }
              throw 'Standard-user setup harness exceeded 55 minutes; fixture teardown is deferred to the disposable runner'
            }
            $exit = $process.ExitCode
            if ($null -eq $exit) { throw 'Standard-user setup harness exit code was unavailable' }
            if ($exit -ne 0) { throw "Native standard-user core setup exited $exit" }
          } finally {
            try {
              foreach ($file in @('contracts.tap', 'runner.stderr')) {
                $partial = Join-Path $work $file
                if (Test-Path -LiteralPath $partial) { Copy-Item -LiteralPath $partial -Destination native-evidence/setup/ -Force }
              }
              $evidence = Join-Path $source 'native-evidence/setup'
              if (Test-Path -LiteralPath $evidence) { Copy-Item -Path (Join-Path $evidence '*') -Destination native-evidence/setup/ -Recurse -Force }
            } finally {
              if (-not $timedOut) { Remove-LocalUser -Name $name -ErrorAction SilentlyContinue }
            }
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-core-setup-windows
          path: native-evidence/setup/
