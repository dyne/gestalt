name: L4 stable Manager acceptance

# TEST transport only: current full Manager + existing Unix compatibility.
# Windows policy25 and unchanged runtime/producer receipts are bound separately.
on:
  push:
    branches: [test/native-core-runtime-slice-l4]

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record exact source and accepted dependency identity
        run: node scripts/record-native-setup.mjs
      - name: Existing disposable Ubuntu sandbox prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          mkdir -p native-evidence/l4-stable
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            id
            stat -c 'tmp uid=%u mode=%a' /tmp
            printf 'before userns=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'before apparmor_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } > native-evidence/l4-stable/host-prerequisites.log
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          {
            printf 'after userns=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'after apparmor_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } >> native-evidence/l4-stable/host-prerequisites.log
      - name: Current full gates and actual Unix authority, with independent captures
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,datetime,json,hashlib,os,re
          root=pathlib.Path.cwd();e=root/'native-evidence/l4-stable';e.mkdir(exist_ok=True)
          now=lambda:datetime.datetime.now(datetime.timezone.utc).isoformat()
          digest=lambda b:hashlib.sha256(b).hexdigest()
          commands=[('manager-full',['npm','test']),('scratch-sandbox',['npm','run','test:scratch:sandbox']),('build-package',['npm','run','build:package']),('docs-build',['npm','run','build']),('unix-authority',['node','tests/native-unix-compatibility.mjs','--agents','.native-dependencies/agents','--evidence','native-evidence/l4-stable/unix-authority'])]
          records=[]
          for name,argv in commands:
              record={'name':name,'argv':argv,'cwd':str(root),'startedAt':now(),'head':os.environ['GITHUB_SHA'],'exit':None,'status':'running'}
              records.append(record);(e/'commands.json').write_text(json.dumps(records,indent=2)+'\n')
              out=e/(name+'.stdout');err=e/(name+'.stderr')
              with out.open('wb') as stdout,err.open('wb') as stderr:result=subprocess.run(argv,stdout=stdout,stderr=stderr)
              record.update({'exit':result.returncode,'status':'completed','observedAt':now()})
              for key,p in [('stdout',out),('stderr',err)]:
                  b=p.read_bytes();record[key]={'relative':p.relative_to(e).as_posix(),'bytes':len(b),'sha256':digest(b)}
              content=out.read_text(errors='replace')+'\n'+err.read_text(errors='replace')
              counts={}
              for key,value in re.findall(r'(?m)^(?:ℹ |# )(tests|pass|fail|skipped|cancelled) (\d+)\r?$',content):counts[key]=counts.get(key,0)+int(value)
              record['reportedCounts']=counts or None
              record['countScope']='Aggregated Node summary blocks only; shell assertions and process probes are separately exit-bound; no invented test counts'
              if name=='manager-full' and (set(counts)!={'tests','pass','fail','skipped','cancelled'} or counts.get('pass',0)<=0 or counts.get('fail',0)!=0 or counts.get('cancelled',0)!=0 or counts.get('tests')!=counts.get('pass',0)+counts.get('fail',0)+counts.get('skipped',0)):
                  record['summaryError']='Missing/contradictory/failed/all-skipped Manager Node summary'
              if name=='scratch-sandbox' and counts!={'tests':1,'pass':1,'fail':0,'skipped':0,'cancelled':0}:
                  record['summaryError']='Exactly one passed, unskipped sandbox test is required'
              (e/'commands.json').write_text(json.dumps(records,indent=2)+'\n')
          cli=root/'dist/cli/gestalt.mjs';cliBytes=cli.read_bytes()
          identity={'observedAt':now(),'head':os.environ['GITHUB_SHA'],'node':subprocess.check_output(['node','--version'],text=True).strip(),'npm':subprocess.check_output(['npm','--version'],text=True).strip(),'CLI':{'bytes':len(cliBytes),'sha256':digest(cliBytes)},'platform':'linux','arch':subprocess.check_output(['node','-p','process.arch'],text=True).strip(),'jobs':'one hosted Ubuntu job; no Windows/macOS execution in this run','complete':all(x['exit']==0 and not x.get('summaryError') for x in records),'scope':'Current full Manager/sandbox/package/docs and actual existing Unix authority; prior Windows proof remains separately fingerprint-bound'}
          (e/'result.json').write_text(json.dumps(identity,indent=2)+'\n')
          assert identity['CLI']=={'bytes':336071,'sha256':'216b6ea052ceb2fa4223f8fc51b9129af020adcfca32fbfd70011e5f9a59bf60'},'Current compiled CLI differs from frozen seal'
          assert identity['complete'],'At least one independent stable gate failed; all command captures retained'
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: l4-stable-manager-linux
          path: |
            native-evidence/l4-stable/
            native-evidence/setup/checkout.json
