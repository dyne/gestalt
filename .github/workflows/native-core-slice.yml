name: Final current Windows npm 12 lifecycle
on:
  push:
    branches: [test/final-npm12-r1]
permissions:
  contents: read
  actions: read
jobs:
  windows-consumer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: b4f783d75c0543010c665072bf7aef07f74f973f
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          architecture: x64
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: gestalt-pr-package-win32-x64
          repository: dyne/gestalt
          run-id: 44531864834
          github-token: ${{ github.token }}
          path: native-evidence/final-current/input
      - name: Prepare exact current package and toolchain
        shell: powershell
        env:
          FINAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          node tests/final-current-transport/driver.mjs windows-consumer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Disable Developer Mode only on this disposable hosted test runner
        if: runner.environment == 'github-hosted'
        shell: powershell
        env:
          GESTALT_TEST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/prepare-core-slice-windows.ps1
      - name: Verify npm 12 lifecycle as a standard user
        shell: powershell
        env:
          FINAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          & ./tests/final-current-transport/consume.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-current-npm12-evidence-${{ github.run_attempt }}
          path: |
            native-evidence/developer-mode-off.json
            native-evidence/final-current/windows-consumer/
            !native-evidence/final-current/windows-consumer/private-toolchain/**
          if-no-files-found: error
