name: Bash 3.2 Unix upgrade correction (TEST only)
on:
  push:
    branches: [test/native-package-l5-unix-bash32]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Uninstrumented released upgrade and restart contracts
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/bin:$PATH"
          mkdir -p native-evidence
          node --version > native-evidence/node-version.txt
          git rev-parse HEAD > native-evidence/head.txt
          command -v bash > native-evidence/bash-path.txt
          bash --version > native-evidence/bash-version.txt
          node --test --test-reporter=tap tests/unix-upgrade.test.mjs tests/update-components.test.mjs tests/manager-compatibility.test.mjs > native-evidence/upgrades.stdout 2> native-evidence/upgrades.stderr
      - name: Current standalone installer in isolated home
        if: always()
        shell: bash
        run: |
          mkdir -p native-evidence
          bash tests/install.test.sh > native-evidence/install.stdout 2> native-evidence/install.stderr
      - name: Actual current tar installed Unix package contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/bin:$PATH"
          mkdir -p native-evidence
          node scripts/test-unix-package.mjs tests/fixtures/native-package-transport/candidate.tgz 36ce3852be3aa47d51d827064fafe20097717b5d8dd73d3693e9f48af286df67 .native-dependencies/agents native-evidence/unix-package > native-evidence/package.stdout 2> native-evidence/package.stderr
      - name: Retain bounded worker diagnostics if uninstrumented assertions fail
        if: ${{ failure() && steps.contracts.outcome == 'failure' }}
        shell: bash
        env:
          GESTALT_UPGRADE_DIAGNOSTICS: ${{ github.workspace }}/native-evidence/workers
        run: |
          set -euo pipefail
          export PATH="/bin:$PATH"
          node --test --test-reporter=tap --test-name-pattern='^(reloaded detached|GUI-compatible detached|failed external GUI|empty restart descriptor)' tests/fixtures/upgrade-correction-diagnostic.test.mjs > native-evidence/workers.stdout 2> native-evidence/workers.stderr
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unix-bash32-correction-macos
          path: native-evidence/
