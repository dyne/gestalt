name: L6 Windows correction and macOS capacity retry (TEST only)

on:
  push:
    branches: [test/native-release-l6-g1-v3]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        default: all
        options: [all, windows, macos]

permissions:
  contents: read

env:
  GESTALT_RELEASE_TARBALL: tests/fixtures/l6-release-transport/candidate.tgz
  GESTALT_RELEASE_TARBALL_SHA256: 82c297c3f6c946f6f03d09a0f2039c82001d8da2b06f730df25389793361e6e4
  GESTALT_RELEASE_SOURCE_HEAD: 91bddd70da5ea67537f45fe8df1bf93e40a7bbf4

jobs:
  macos:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - name: Record exact current source and accepted dependency identity
        run: node scripts/record-native-setup.mjs
      - name: Actual installed Unix package, released upgrades and standalone installer
        shell: bash
        run: |
          mkdir -p native-evidence/unix-package
          python3 scripts/l6-unix-target.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: l6-package-macos
          path: |
            native-evidence/unix-package/
            native-evidence/setup/checkout.json

  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - name: Record TEST source and supply exact accepted helper and npm client
        shell: pwsh
        run: |
          node scripts/record-native-setup.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source inventory failed' }
          New-Item -ItemType Directory native-evidence/frozen-helper,.native-dependencies/npm12 | Out-Null
          if ((Get-FileHash -LiteralPath $env:GESTALT_RELEASE_TARBALL -Algorithm SHA256).Hash -ne $env:GESTALT_RELEASE_TARBALL_SHA256) { throw 'Frozen package digest differs' }
          tar.exe -xzf $env:GESTALT_RELEASE_TARBALL -C native-evidence/frozen-helper package/lib/native/gestalt-owned-process.exe package/lib/native/gestalt-owned-process.exe.provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen helper extraction failed' }
          $client = Join-Path $env:RUNNER_TEMP 'npm-12.2.2.tgz'
          Invoke-WebRequest -Uri 'https://registry.npmjs.org/npm/-/npm-12.2.2.tgz' -OutFile $client
          $actual = (Get-FileHash -LiteralPath $client -Algorithm SHA512).Hash
          if ($actual -ne '2a09606d9c9a71fee31fe147b8d46a56e0b3422f15848d9aec9f3b231e3716c3d3b99a065a62175c6759b4150e03bf6fc0bf8825112a511573ba903b3ec41370') { throw 'Pinned npm 12 integrity differs' }
          tar.exe -xzf $client -C .native-dependencies/npm12
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm extraction failed' }
          @{observedAt=[DateTime]::UtcNow.ToString('o'); version='12.2.2'; sha512=$actual} | ConvertTo-Json > native-evidence/npm12-builder.json
      - name: Bind actual unmodified package and accepted Org artifacts outside the consumer account
        env:
          GESTALT_CORE_SLICE_PACKAGE: '1'
          GESTALT_CORE_SLICE_NPM_SOURCE_HEAD: 91bddd70da5ea67537f45fe8df1bf93e40a7bbf4
          GESTALT_CORE_SLICE_NATIVE_ARTIFACTS: native-evidence/frozen-helper/package/lib/native
        shell: pwsh
        run: |
          $env:GESTALT_CORE_SLICE_NPM_TARBALL = $env:GESTALT_RELEASE_TARBALL
          $env:GESTALT_CORE_SLICE_NPM_SHA256 = $env:GESTALT_RELEASE_TARBALL_SHA256
          node tests/native-core-slice.mjs --prepare native-evidence/core-slice-prebuilt --agents .native-dependencies/agents
          exit $LASTEXITCODE
      - name: Disable Developer Mode only on this disposable hosted test runner
        if: runner.environment == 'github-hosted'
        shell: powershell
        env:
          GESTALT_TEST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/prepare-core-slice-windows.ps1
      - name: Consume the exact npm package as a standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'gs' + [Guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + '!aA1') -AsPlainText -Force
          $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
          $work = Join-Path $env:RUNNER_TEMP $name
          $source = Join-Path $work 'source'
          $process = $null; $observed = $false; $timedOut = $false
          try {
            $users = Get-LocalGroup -SID 'S-1-5-32-545'; Add-LocalGroupMember -Group $users -Member $user
            New-Item -ItemType Directory -Path $work | Out-Null
            & robocopy $env:GITHUB_WORKSPACE $source /E /XD .git /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt 7) { throw 'Candidate copy failed' }
            & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)F') /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Fixture access setup failed' }
            $credential = New-Object Management.Automation.PSCredential(($env:COMPUTERNAME + '\' + $name), $password)
            $node = (Get-Command node.exe).Source
            $gitDirectory = Split-Path -Parent (Get-Command git.exe).Source
            # Verify associated Process exit observation under this credential;
            # it is CI observation, not a product descendant-release proof.
            foreach ($expectedExit in @(0, 23)) {
              $gate = Join-Path $work ('probe-' + $expectedExit + '.gate')
              $program = '$gate=''' + $gate.Replace("'", "''") + ''';$end=[DateTime]::UtcNow.AddSeconds(10);while(-not [IO.File]::Exists($gate)){if([DateTime]::UtcNow -ge $end){exit 96};Start-Sleep -Milliseconds 10};exit ' + $expectedExit
              $probeArguments = '-NoLogo -NoProfile -NonInteractive -EncodedCommand ' + [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($program))
              $probe = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $credential -LoadUserProfile -ArgumentList $probeArguments -PassThru
              $handle = $probe.Handle
              if ($handle -eq [IntPtr]::Zero -or $handle -eq [IntPtr](-1)) { throw 'Exit probe handle unavailable' }
              [IO.File]::WriteAllText($gate, 'release')
              if (-not $probe.WaitForExit(10000)) { $probe.Kill(); throw 'Exit probe deadline; descendant state unknown' }
              $exit = $probe.ExitCode
              @{observedAt=[DateTime]::UtcNow.ToString('o');expected=$expectedExit;exit=$exit;handleRetained=$true} | ConvertTo-Json > ('native-evidence/exit-probe-' + $expectedExit + '.json')
              $probe.Dispose()
              if ($null -eq $exit -or $exit -ne $expectedExit) { throw 'Exit probe result differs' }
            }
            $script = Join-Path $source 'scripts/test-core-slice-standard-user.ps1'
            $arguments = '-NoLogo -NoProfile -NonInteractive -File "' + $script + '" -Repository "' + $source + '" -Node "' + $node + '" -GitDirectory "' + $gitDirectory + '" -FinalPackage'
            $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $credential -LoadUserProfile -ArgumentList $arguments -PassThru -RedirectStandardOutput (Join-Path $work 'slice.stdout') -RedirectStandardError (Join-Path $work 'slice.stderr')
            $handle = $process.Handle
            if ($handle -eq [IntPtr]::Zero -or $handle -eq [IntPtr](-1)) { throw 'Consumer harness handle unavailable' }
            $observed = $process.WaitForExit(4800000)
            if (-not $observed) { $timedOut = $true; $process.Kill(); throw 'Consumer deadline; product descendant certainty remains unknown' }
            $exit = $process.ExitCode
            if ($null -eq $exit -or $exit -ne 0) { throw "Native consumer slice failed: $exit" }
          } finally {
            foreach ($file in @('slice.stdout', 'slice.stderr')) {
              $partial = Join-Path $work $file
              if (Test-Path -LiteralPath $partial) { Copy-Item -LiteralPath $partial -Destination native-evidence/ -Force }
            }
            $partial = Join-Path $source 'native-evidence/core-slice'
            if (Test-Path -LiteralPath $partial) { Copy-Item -LiteralPath $partial -Destination native-evidence/ -Recurse -Force }
            foreach ($file in @('copied-source-verification.json', 'copied-toolchain-verification.json')) {
              $receipt = Join-Path $source "native-evidence/setup/$file"
              if (Test-Path -LiteralPath $receipt) { Copy-Item -LiteralPath $receipt -Destination native-evidence/setup/ -Force }
            }
            @{observedAt=[DateTime]::UtcNow.ToString('o');directExitObserved=$observed;timedOut=$timedOut;scope='CI handle observation only; consult matching native Job claims';teardown=$(if ($timedOut) {'deferred to disposable runner'} else {'account removal; no independent tree proof'})} | ConvertTo-Json > native-evidence/harness-observation.json
            if (-not $timedOut) { Remove-LocalUser -Name $name -ErrorAction SilentlyContinue }
          }
      - name: Verify both lifecycle lanes and executed native contracts
        run: python scripts/l6-windows-evidence.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: l6-package-windows
          path: |
            native-evidence/
            !native-evidence/core-slice/codex-artifact/**
            !native-evidence/frozen-helper/**
