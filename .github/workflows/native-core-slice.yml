name: Detached Unix worker diagnostics (TEST only)
on:
  push:
    branches: [test/native-package-l5-unix-worker-diagnostics]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Existing detached workers with bounded diagnostics
        shell: bash
        env:
          GESTALT_UPGRADE_DIAGNOSTICS: ${{ github.workspace }}/native-evidence/workers
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          node --version > native-evidence/node-version.txt
          git rev-parse HEAD > native-evidence/head.txt
          command -v bash > native-evidence/bash-path.txt
          bash --version > native-evidence/bash-version.txt
          /bin/bash --version > native-evidence/system-bash-version.txt
          node --check tests/update-components.test.mjs
          node --check tests/upgrade-worker-diagnostics.mjs
          node --test --test-reporter=tap --test-name-pattern='^(reloaded detached update worker|GUI-compatible detached update-restart|failed external GUI update)' tests/update-components.test.mjs > native-evidence/workers.stdout 2> native-evidence/workers.stderr
      - name: Current standalone installer in isolated home
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          bash tests/install.test.sh > native-evidence/install.stdout 2> native-evidence/install.stderr
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unix-worker-diagnostics-macos
          path: native-evidence/
