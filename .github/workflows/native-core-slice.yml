name: L5 stable Manager and package acceptance (TEST only)
on:
  push:
    branches: [test/native-package-l5-full-gates]
permissions:
  contents: read
jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: dyne/gestalt-agents
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-dependencies/agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record exact current source and accepted dependency identity
        run: node scripts/record-native-setup.mjs
      - name: Existing disposable Ubuntu sandbox prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence/l5-stable
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            id
            stat -c 'tmp uid=%u mode=%a' /tmp
            printf 'before userns=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'before apparmor_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } > native-evidence/l5-stable/host-prerequisites.log
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          {
            printf 'after userns=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'after apparmor_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } >> native-evidence/l5-stable/host-prerequisites.log
      - name: Current full Manager, package, docs, sandbox and Unix authority gates
        run: python3 scripts/l5-full-gates.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: l5-stable-manager-linux
          path: |
            native-evidence/l5-stable/
            native-evidence/setup/checkout.json
