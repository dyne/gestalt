name: Released Unix upgrade contracts (TEST only)
on:
  push:
    branches: [test/native-package-l5-unix-upgrade-version]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Released upgrade, rollback, interruption and existing Unix orchestration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          node --version > native-evidence/node-version.txt
          git rev-parse HEAD > native-evidence/head.txt
          node --check tests/unix-upgrade.test.mjs
          bash -n tests/run.sh
          node --test --test-reporter=tap tests/unix-upgrade.test.mjs tests/update-components.test.mjs tests/manager-compatibility.test.mjs > native-evidence/upgrades.stdout 2> native-evidence/upgrades.stderr
          bash tests/install.test.sh > native-evidence/install.stdout 2> native-evidence/install.stderr
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unix-upgrade-macos
          path: native-evidence/
