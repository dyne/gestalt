name: Native platform contracts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - run: npm run build:platform
      - name: Record target and helper identities
        run: |
          mkdir -p native-evidence
          node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,os:require("node:os").release(),sha:process.env.GITHUB_SHA,observedAt:new Date().toISOString()}))' > native-evidence/runner.json
          cp dist/cli/native/*.provenance.json native-evidence/
      # Match the existing pull-request.yml native sandbox prerequisite. This
      # prepares only the disposable GitHub-hosted runner, never product runtime.
      - name: Prepare disposable Ubuntu namespace prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            id
            printf 'before unprivileged_userns_clone=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'before apparmor_restrict_unprivileged_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } > native-evidence/linux-namespace-prerequisites.log
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          {
            printf 'after unprivileged_userns_clone=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'after apparmor_restrict_unprivileged_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } >> native-evidence/linux-namespace-prerequisites.log
      - name: Record supported macOS broker commands without changing services
        if: runner.os == 'macOS'
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const result = spawnSync('/bin/launchctl', ['help'], { encoding: 'utf8', shell: false });
          writeFileSync('native-evidence/launchctl-help.json', JSON.stringify({ command: ['/bin/launchctl', 'help'], status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr, observedAt: new Date().toISOString() }));
          JS
      - name: Execute actual native contracts
        run: npm run test:platform > native-evidence/contracts.tap 2>&1
        env:
          GESTALT_NATIVE_TEST_EVIDENCE: native-evidence
      - name: Exercise official pinned Codex in the actual owned terminal without a model request
        run: node tests/native-codex-terminal.mjs > native-evidence/codex-terminal.log 2>&1
        env:
          GESTALT_NATIVE_TEST_EVIDENCE: native-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-platform-${{ matrix.os }}
          path: |
            native-evidence/
            !native-evidence/pinned-codex/artifact/bin/**
            !native-evidence/pinned-codex/artifact/home/**
            !native-evidence/pinned-codex/fixtures/home/**
            !native-evidence/pinned-codex/artifact/*.tar.gz
            !native-evidence/pinned-codex/artifact/*.exe

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - name: Execute contracts as an isolated standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'gn' + [Guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + '!aA1') -AsPlainText -Force
          $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
          $work = Join-Path $env:RUNNER_TEMP $name
          try {
            $users = Get-LocalGroup -SID 'S-1-5-32-545'
            Add-LocalGroupMember -Group $users -Member $user
            New-Item -ItemType Directory -Path $work | Out-Null
            $source = Join-Path $work 'source'
            & robocopy $env:GITHUB_WORKSPACE $source /E /XD .git dist native-evidence /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt 7) { throw 'Native candidate copy failed' }
            & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)F') /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Native fixture access setup failed' }
            $credential = New-Object Management.Automation.PSCredential(($env:COMPUTERNAME + '\' + $name), $password)
            $node = (Get-Command node.exe).Source
            $script = Join-Path $source 'scripts/test-platform-standard-user.ps1'
            $arguments = '-NoLogo -NoProfile -NonInteractive -File "' + $script + '" -Repository "' + $source + '" -Node "' + $node + '"'
            $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput (Join-Path $work 'contracts.tap') -RedirectStandardError (Join-Path $work 'runner.stderr')
            $result = $process.ExitCode
            New-Item -ItemType Directory native-evidence -Force | Out-Null
            Copy-Item (Join-Path $work 'contracts.tap') native-evidence/
            Copy-Item (Join-Path $work 'runner.stderr') native-evidence/
            $ownedProvenance = Join-Path $source 'native-evidence/owned-process-tested.provenance.json'
            if (Test-Path -LiteralPath $ownedProvenance) { Copy-Item -LiteralPath $ownedProvenance native-evidence/ }
            $ownedBinary = Join-Path $source 'native-evidence/gestalt-owned-process.exe'
            if (Test-Path -LiteralPath $ownedBinary) { Copy-Item -LiteralPath $ownedBinary native-evidence/ }
            $testEvidence = Join-Path $source 'native-evidence'
            if (Test-Path -LiteralPath $testEvidence) { Get-ChildItem -LiteralPath $testEvidence -Filter 'windows-settlement-*' -File | Copy-Item -Destination native-evidence/ }
            if (Test-Path -LiteralPath $testEvidence) { Get-ChildItem -LiteralPath $testEvidence -Filter 'terminal-owned-process*' -File | Copy-Item -Destination native-evidence/ }
            if (Test-Path -LiteralPath $testEvidence) { Get-ChildItem -LiteralPath $testEvidence -Filter 'terminal-resize-no-ack*' -File | Copy-Item -Destination native-evidence/ }
            $codexEvidence = Join-Path $testEvidence 'pinned-codex'
            if (Test-Path -LiteralPath $codexEvidence) { Copy-Item -LiteralPath $codexEvidence -Destination native-evidence/ -Recurse }
            $nodeVersion = & node --version
            $nodeArchitecture = & node -p process.arch
            @{ platform = 'win32'; arch = $nodeArchitecture; node = $nodeVersion; os = [Environment]::OSVersion.VersionString; sha = $env:GITHUB_SHA; observedAt = [DateTime]::UtcNow.ToString('o') } | ConvertTo-Json > native-evidence/runner.json
            Get-FileHash src/cli/platform/windows-system.ts -Algorithm SHA256 | Format-List > native-evidence/windows-source.sha256
            $PSVersionTable | ConvertTo-Json > native-evidence/powershell.json
            if ($result -ne 0) { throw "Native standard-user contracts exited $result" }
          } finally {
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-platform-windows
          path: |
            native-evidence/
            !native-evidence/pinned-codex/artifact/bin/**
            !native-evidence/pinned-codex/artifact/home/**
            !native-evidence/pinned-codex/fixtures/home/**
            !native-evidence/pinned-codex/artifact/*.tar.gz
            !native-evidence/pinned-codex/artifact/*.exe

  linux-inherited-diagnostic:
    # Test-only hypothesis, never a selected production backend. Exact accepted
    # Agents code supplies the unchanged guard and publication implementation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: dyne/gestalt-agents
          # e98 is unpublished. This immutable existing snapshot has the exact
          # complete Org-script subtree; diagnostic validates all15 accepted
          # e98 blobs, bytes and modes before imports, without changing PR81.
          ref: 8827347387ee32e2c5bd7eb912f9b80185cdad45
          path: .native-diagnostic-agents
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the legacy negative baseline needs this existing disposable-runner
      # userns prerequisite. The ptrace experiment changes no runtime policy.
      - name: Prepare and record disposable legacy namespace baseline
        run: |
          set -euo pipefail
          mkdir -p native-diagnostic-evidence
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            id
            uname -a
            cat /proc/self/uid_map /proc/self/gid_map
            if [[ -r /proc/sys/kernel/yama/ptrace_scope ]]; then cat /proc/sys/kernel/yama/ptrace_scope; else printf 'yama ptrace_scope unavailable\n'; fi
            printf 'before userns=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'before apparmor_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } > native-diagnostic-evidence/prerequisites.log
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          {
            printf 'after userns=%s\n' "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            printf 'after apparmor_userns=%s\n' "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
            node -e 'console.log(JSON.stringify({sha:process.env.GITHUB_SHA,node:process.version,arch:process.arch,platform:process.platform,uid:process.getuid(),gid:process.getgid(),observedAt:new Date().toISOString()}))'
          } >> native-diagnostic-evidence/prerequisites.log
      - name: Execute actual inherited authority, lifecycle and pinned Codex diagnostics
        run: node tests/native-inherited-diagnostic.mjs --agents .native-diagnostic-agents --evidence native-diagnostic-evidence > native-diagnostic-evidence/execution.log 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-inherited-diagnostic
          path: |
            native-diagnostic-evidence/
            !native-diagnostic-evidence/codex-artifact/bin/**
            !native-diagnostic-evidence/codex-artifact/home/**
            !native-diagnostic-evidence/codex-artifact/*.tar.gz
            !native-diagnostic-evidence/codex-artifact/*.exe
