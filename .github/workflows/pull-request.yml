name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Match the native sandbox prerequisites in the deployment workflow.
      - name: Enable native Codex sandbox user namespaces
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify native Codex sandbox
        run: |
          set -euo pipefail
          sandbox_home=$(mktemp -d)
          trap 'rm -rf -- "$sandbox_home"' EXIT
          CODEX_HOME="$sandbox_home" ./node_modules/.bin/codex \
            -c 'default_permissions=":read-only"' sandbox -- /bin/true

      - name: Test installation tooling (1/2)
        timeout-minutes: 5
        run: npm test -- --shard 1/2

      - name: Test installation tooling (2/2)
        timeout-minutes: 5
        run: npm test -- --shard 2/2

      - name: Build documentation
        env:
          BASE_PATH: /gestalt/
        run: npm run build

      - name: Verify package with the publication npm client
        timeout-minutes: 2
        run: npx --yes npm@latest run test:package
