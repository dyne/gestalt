name: windows-local-prep-probe
on:
  push:
    branches: [test/windows-local-prep-r1]
permissions:
  contents: read
jobs:
  local-preparation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          architecture: x64
          package-manager-cache: false
      - name: Observe two private-storage operations as a standard user
        shell: powershell
        env:
          PROBE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          & ./tests/windows-local-prep/standard-user.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-local-prep-r1-evidence-${{ github.run_attempt }}
          path: native-evidence/windows-local-prep/
          if-no-files-found: error
